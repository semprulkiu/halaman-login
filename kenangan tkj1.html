<script>

let namaUser = "";

// LOGIN

function login(){

  let user = document.getElementById("username").value;
  let pass = document.getElementById("password").value;

  if(user !== "" && pass === "tkj1"){

    namaUser = user;

    document.getElementById("loginPage").style.display = "none";
    document.getElementById("website").style.display = "block";

    document.getElementById("welcomeText").innerHTML =
    "Selamat datang <b style='color:#00ffff'>" +
    namaUser +
    "</b> di website kenangan TKJ ⚡";

  }else{

    document.getElementById("error").style.display = "block";

  }

}

// TAMBAH FOTO KE GALERI

function tambahGaleri(nama, foto){

  const card = document.createElement("div");

  card.classList.add("card");

  card.innerHTML = `
    <img src="${foto}">

    <div class="text">

      <h3>${nama}</h3>

      <p>Baru saja upload kenangan ⚡</p>

    </div>
  `;

  document.getElementById("gallery").prepend(card);

}

// LOAD FOTO SAAT REFRESH

window.onload = function(){

  let data =
    JSON.parse(localStorage.getItem("kenangan")) || [];

  data.forEach(item => {

    tambahGaleri(item.nama, item.foto);

  });

}

// UPLOAD FOTO

function uploadFile(){

  const file = document.getElementById("fileInput").files[0];

  if(!file){

    alert("Pilih foto dulu!");
    return;

  }

  const reader = new FileReader();

  reader.onload = function(e){

    const imageData = e.target.result;

    // tampilkan di web
    tambahGaleri(namaUser, imageData);

    // simpan local storage
    let dataLama =
      JSON.parse(localStorage.getItem("kenangan")) || [];

    dataLama.unshift({

      nama:namaUser,
      foto:imageData

    });

    localStorage.setItem(
      "kenangan",
      JSON.stringify(dataLama)
    );

    // upload ke Google Drive

    fetch("https://script.google.com/macros/s/AKfycbzYwXFc5ArLqKo5tILACb2bj5b4i0cSnWJjh4bjhu3Ps8hGlG92wbfKPSuqx0eniY4x/exec",{

      method:"POST",

      body:JSON.stringify({

        nama:namaUser,
        file:imageData

      })

    })
    .then(res => res.text())
    .then(data => {

      console.log(data);

      alert("📢 Upload berhasil masuk Google Drive!");

    })
    .catch(err => {

      console.log(err);

      alert("Upload gagal!");

    });

  }

  reader.readAsDataURL(file);

}

</script>
